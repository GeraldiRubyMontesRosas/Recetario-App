<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tabla reutilizable — preview de estilos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="table-container">

  <div class="header">
    <ng-content select="[header]"></ng-content>
  </div>

    <div class="toolbar">
      <button class="btn-create">Crear</button>
      <input type="text" placeholder="Buscar...">
    </div>

      <table>
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.header }}</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of paginatedData()">
        <td *ngFor="let col of columns">
          <img *ngIf="col.type === 'image'" [src]="item[col.field]" width="60" alt="">
          <span *ngIf="col.type !== 'image'">{{ item[col.field] }}</span>
        </td>

        <td class="actions">
          <button (click)="edit.emit(item)"><i class="fa-solid fa-pen"></i></button>
          <button (click)="delete.emit(item)"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>

      <tr *ngIf="paginatedData().length === 0">
        <td [attr.colspan]="columns.length + 1" class="empty">
          No hay resultados
        </td>
      </tr>
    </tbody>
  </table>

    <div class="footer">
      <div style="font-size:0.8rem; color: var(--ink-soft);">3 resultados</div>
        <div class="pagination">
          <button (click)="prevPage()" [disabled]="currentPage() === 1">‹</button>
          <span>{{ currentPage() }} de {{ totalPages() }}</span>
          <button (click)="nextPage()" [disabled]="currentPage() === totalPages()">›</button>
        </div>
    </div>

  </div>

</body>
</html>
